"on":
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
          check-dir: '"check"'
          upload-results: always

      # CRAN checks deliberately skip Julia. Exercise the real registered
      # backend separately on all three release platforms.
      - uses: julia-actions/setup-julia@v3
        if: matrix.config.r == 'release'
        with:
          version: '1.12'

      - uses: julia-actions/cache@v3
        if: matrix.config.r == 'release'
        with:
          delete-old-caches: 'false'

      - name: Install registered ConScape for integration tests
        if: matrix.config.r == 'release'
        run: julia --startup-file=no -e 'using Pkg; Pkg.add(PackageSpec(name="ConScape", version="0.3.0")); Pkg.status()'
        shell: bash

      - name: Test real Julia workflows
        if: matrix.config.r == 'release'
        shell: Rscript {0}
        env:
          RUN_CONSCAPERTOOLS_INTEGRATION: 'true'
          NOT_CRAN: 'true'
        run: |
          Sys.setenv(CONSCAPERTOOLS_JL_HOME = dirname(Sys.which("julia")))
          # Separate R workers cannot use pkgload's in-process development namespace.
          install.packages(".", repos = NULL, type = "source")
          stopifnot(as.character(packageVersion("ConScapeRtools")) ==
                    read.dcf("DESCRIPTION")[1, "Version"])
          pkgload::load_all()
          testthat::test_local(stop_on_failure = TRUE)
